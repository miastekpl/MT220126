; PlatformIO Project Configuration File
; System Sterowania Malowaniem Pasów Drogowych v1.0.0
;
; Dokumentacja: https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Konfiguracja dla ESP32-S3 N16R8
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB

; Częstotliwość CPU dla maksymalnej wydajności
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Prędkość portu szeregowego
monitor_speed = 115200
upload_speed = 921600

; Dodatkowe flagi kompilatora dla optymalizacji
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=22
    -DTFT_RST=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Biblioteki wymagane przez projekt
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    mathertel/RotaryEncoder@^1.5.3
    bblanchon/ArduinoJson@^6.21.4
    adafruit/Adafruit GFX Library@^1.11.9
    https://github.com/PaulStoffregen/Encoder.git

; Partycje dla ESP32-S3
board_build.partitions = default_16MB.csv

; Opcje debugowania
debug_tool = esp-prog
debug_init_break = tbreak setup
