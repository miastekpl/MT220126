; PlatformIO Project Configuration File
; System Sterowania Malowaniem Pasów Drogowych v1.6.8
;
; Dokumentacja: https://docs.platformio.org/page/projectconf.html
;
; v1.6.8: FIX GPIO 227 - własny User_Setup.h dla TFT_eSPI!
;         Problem: Biblioteka TFT_eSPI używała pinów ESP8266 (PIN_D*) zamiast ESP32-S3
;         Rozwiązanie: Własny include/User_Setup.h z prawidłowymi pinami

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Konfiguracja dla ESP32-S3
; UWAGA v1.6.4: Jeśli Twój ESP32-S3 MA PSRAM (N16R8), odkomentuj poniższe linie:
; board_build.psram_type = opi
; board_build.arduino.memory_type = qio_opi
; Jeśli NIE MA PSRAM - zostaw zakomentowane (sprites będą wyłączone automatycznie)

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; Częstotliwość CPU dla maksymalnej wydajności
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Prędkość portu szeregowego
monitor_speed = 115200
upload_speed = 921600

; v1.6.8: KRYTYCZNE - nasz include/ MUSI być PRZED bibliotekami!
; To gwarantuje że nasz User_Setup.h zostanie załadowany zamiast domyślnego
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=3
    ; -DBOARD_HAS_PSRAM  ; WYŁĄCZONE v1.6.4: Auto-detect, fallback jeśli brak PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; v1.6.8: Konfiguracja TFT przeniesiona do include/User_Setup.h
    ; NIE definiujemy USER_SETUP_LOADED - pozwalamy TFT_eSPI znaleźć nasz User_Setup.h

; Biblioteki wymagane przez projekt
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.4
    adafruit/Adafruit GFX Library@^1.11.9

; Partycje dla ESP32-S3
board_build.partitions = default_16MB.csv

; v1.6.8: Wymuś rekompilację bibliotek (ważne dla TFT_eSPI!)
lib_archive = false

; Opcje debugowania
debug_tool = esp-prog
debug_init_break = tbreak setup
